<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #fdf6f6 0%, #f8ece8 100%);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px;
  color: #5a4a4a;
}
.card {
  background: #fff; border-radius: 16px;
  box-shadow: 0 2px 12px rgba(232,160,160,0.1);
  width: 100%; max-width: 400px;
  padding: 24px; margin-bottom: 16px;
}
h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 13px; color: #b0a0a0; margin-bottom: 20px; }
.stats { display: flex; justify-content: space-around; margin-bottom: 20px; }
.stat-item { text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; color: #e8a0a0; }
.stat-label { font-size: 11px; color: #b0a0a0; margin-top: 2px; }
.btn {
  display: block; width: 100%; padding: 14px;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #e8a0a0, #f0b8b8);
  color: #fff; box-shadow: 0 2px 8px rgba(232,160,160,0.3);
}
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.btn-primary:disabled { opacity: 0.5; transform: none; }
.btn-outline {
  background: #fff; color: #e8a0a0;
  border: 1.5px solid #f0dcdc;
  margin-top: 12px; font-size: 14px;
}
.btn-outline:active { background: #fdf6f6; }
.status { 
  text-align: center; font-size: 13px; margin-top: 16px; padding: 10px;
  border-radius: 10px; display: none;
}
.status.success { display: block; background: #f0fff5; color: #4caf84; }
.status.error { display: block; background: #fff0f0; color: #e88888; }
.status.info { display: block; background: #f5f0ff; color: #9b7ec4; }
.warning {
  background: #fffdf0; border: 1px solid #f0e8c0; border-radius: 10px;
  padding: 12px; font-size: 12px; color: #b0a050; margin-bottom: 16px;
  line-height: 1.6;
}
.preview { margin-top: 16px; max-height: 200px; overflow-y: auto; }
.preview table { width: 100%; font-size: 12px; border-collapse: collapse; }
.preview th { 
  position: sticky; top: 0; background: #fdf6f6;
  padding: 6px 4px; text-align: left; font-size: 11px;
  color: #b0a0a0; border-bottom: 1px solid #f0dcdc;
}
.preview td { padding: 6px 4px; border-bottom: 1px solid #f8ece8; }
.preview .cat { 
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  font-size: 10px; color: #fff; 
}
.cat-食品 { background: #e8b080; }
.cat-用品 { background: #a0b8d8; }
.cat-玩具 { background: #c0a0c8; }
.cat-医疗 { background: #e88888; }
.cat-美容 { background: #a8c9a8; }
.cat-其他 { background: #b0a0a0; }
</style>
</head>

// 计算统计
(function() {
  var total = 0, cats = {};
  PET_DATA.forEach(function(e) { total += e.amount; cats[e.category] = true; });
  document.getElementById('totalAmount').textContent = '¥' + total.toLocaleString('zh-CN', {minimumFractionDigits:0,maximumFractionDigits:0});
  document.getElementById('catCount').textContent = Object.keys(cats).length;
})();

var shown = false;
function togglePreview() {
  var el = document.getElementById('preview');
  if (shown) { el.style.display = 'none'; shown = false; return; }
  shown = true;
  var html = '<table><thead><tr><th>日期</th><th>分类</th><th>金额</th><th>备注</th></tr></thead><tbody>';
  PET_DATA.slice(0, 50).forEach(function(e) {
    html += '<tr><td>' + e.date + '</td><td><span class="cat cat-' + e.category + '">' + e.category + '</span></td><td>¥' + e.amount.toFixed(2) + '</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (e.note||'') + '</td></tr>';
  });
  if (PET_DATA.length > 50) html += '<tr><td colspan="4" style="text-align:center;color:#b0a0a0">... 还有 ' + (PET_DATA.length - 50) + ' 条</td></tr>';
  html += '</tbody></table>';
  el.innerHTML = html;
  el.style.display = 'block';
}

function showStatus(msg, type) {
  var s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status ' + type;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function doImport() {
  var btn = document.getElementById('btnImport');
  btn.disabled = true;
  btn.textContent = '⏳ 正在导入...';
  showStatus('正在读取工作台数据...', 'info');

  var STORAGE_KEY = 'yuanqi_workstation_data';
  
  try {
    // 读取现有数据
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // 工作台还没打开过，创建一个新的数据结构
      var newData = {
        expenses: [], weightLogs: [], giftRecords: [], calorieLogs: [],
        petExpenses: [],
        goldHoldings: {}, goldRecords: [],
        savingsPlan: { target: 50000, deadline: '' }, incomeRecords: [],
        englishCheckin: {}, englishPlan: { currentDay: 1, totalDays: 150, ieltsTarget: 6.5 },
        loveSettings: {}, calorieSettings: {}, books: [], settings: { theme: 'pink' }
      };
      
      // 如果 localStorage 完全为空，先写入基础结构
      var existingKeys = [];
      for (var i = 0; i < localStorage.length; i++) {
        existingKeys.push(localStorage.key(i));
      }
      var hasAnyData = existingKeys.some(function(k) { return k.indexOf('yuanqi') >= 0; });
      
      if (!hasAnyData) {
        showStatus('未检测到工作台数据，请先在手机浏览器打开一次元气小红工作台页面！', 'error');
        btn.disabled = false;
        btn.textContent = '📥 一键导入到工作台';
        return;
      }
      
      // 尝试用其他可能的 key
      for (var j = 0; j < existingKeys.length; j++) {
        var k = existingKeys[j];
        if (k.indexOf('yuanqi') >= 0) {
          STORAGE_KEY = k;
          raw = localStorage.getItem(k);
          break;
        }
      }
      
      if (!raw) {
        showStatus('未检测到工作台数据，请先在手机浏览器打开一次元气小红工作台页面！', 'error');
        btn.disabled = false;
        btn.textContent = '📥 一键导入到工作台';
        return;
      }
    }

    var data = JSON.parse(raw);
    
    // 确保 petExpenses 存在
    if (!data.petExpenses) data.petExpenses = [];
    
    var existing = data.petExpenses;
    var added = 0, skipped = 0;
    
    // 构建已有记录的索引（日期+金额+备注）
    var existingSet = {};
    existing.forEach(function(e) {
      var key = (e.date||'') + '|' + (e.amount||0) + '|' + (e.note||'');
      existingSet[key] = true;
    });
    
    // 合并新数据
    PET_DATA.forEach(function(e) {
      var key = (e.date||'') + '|' + (e.amount||0) + '|' + (e.note||'');
      if (existingSet[key]) {
        skipped++;
        return;
      }
      existing.push({
        id: uid(),
        date: e.date,
        category: e.category,
        amount: e.amount,
        note: e.note || ''
      });
      existingSet[key] = true;
      added++;
    });
    
    // 按日期排序
    existing.sort(function(a, b) { return b.date.localeCompare(a.date); });
    
    // 保存
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    
    btn.textContent = '✅ 导入完成！';
    showStatus(
      '成功导入 ' + added + ' 条记录' + (skipped > 0 ? '，跳过 ' + skipped + ' 条重复' : '') + '！\n现在返回工作台，进入「小锤」页面即可看到数据。',
      'success'
    );
    
    setTimeout(function() {
      btn.disabled = false;
      btn.textContent = '📥 一键导入到工作台';
    }, 3000);
    
  } catch(e) {
    showStatus('导入失败：' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '📥 一键导入到工作台';
  }
}
</script>
